<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Фото</title>
  <style>
    body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; padding: 40px; background: #f5f5f5; }
    h1 { margin-bottom: 30px; }
    .controls { display: flex; flex-direction: column; align-items: center; gap: 16px; margin-bottom: 30px; }
    .search-row { display: flex; gap: 8px; }
    input { padding: 8px 12px; font-size: 16px; border: 1px solid #ccc; border-radius: 4px; width: 250px; }
    button { padding: 8px 16px; font-size: 16px; cursor: pointer; border: none; border-radius: 4px; background: #4a90e2; color: white; }
    button:hover { background: #357abd; }
    #error { color: red; min-height: 20px; }
    #photo-container img { max-width: 600px; max-height: 500px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.2); }
  </style>
</head>
<body>
  <h1>Поиск фото</h1>
  <div class="controls">
    <button id="btn-random">Случайное фото</button>
    <div class="search-row">
      <input type="text" id="query" placeholder="Введите запрос...">
      <button id="btn-search">Найти</button>
    </div>
  </div>
  <p id="error"></p>
  <div id="photo-container"></div>
  <script src="app.js"></script>
</body>
</html>
